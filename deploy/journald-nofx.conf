# C3 — nofx journald hardening drop-in.
# Install to /etc/systemd/journald.conf.d/nofx.conf (root), then restart
# systemd-journald. See deploy/install-journald.sh.
#
# Storage=persistent: keep logs across reboots in /var/log/journal (do not rely on
#   the default "auto", which only persists if that dir happens to exist).
# SystemMaxUse=2G: hard cap the on-disk journal so it can never fill the disk
#   (it was ~3.9G unbounded before this). journald prunes oldest first.
[Journal]
Storage=persistent
SystemMaxUse=2G
